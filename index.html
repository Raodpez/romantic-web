<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia 💖</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Contenedor de animaciones de fondo -->
    <div class="animaciones-fondo" id="animaciones-fondo"></div>

    <!-- Selector de temas -->
    <div class="selector-temas">
        <button class="btn-tema" data-tema="rosa" title="Rosa Romántico (Claro)"></button>
        <button class="btn-tema" data-tema="violeta-claro" title="Violeta Suave (Claro)"></button>
        <button class="btn-tema" data-tema="durazno" title="Durazno Cálido (Claro)"></button>
        <button class="btn-tema" data-tema="violeta-oscuro" title="Violeta Nocturno (Oscuro)"></button>
        <button class="btn-tema" data-tema="burgundy" title="Vino Profundo (Oscuro)"></button>
        <button class="btn-tema" data-tema="azul-noche" title="Azul Noche (Oscuro)"></button>
    </div>

    <!-- Reproductor de música flotante -->
    <div class="reproductor" id="reproductor">
        <div class="reproductor-portada" id="reproductor-portada">
            <div class="portada-icono">🎵</div>
        </div>
        <div class="reproductor-info">
            <p class="reproductor-titulo" id="reproductor-titulo">Canción de hoy</p>
            <div class="barra-progreso-contenedor">
                <div class="barra-progreso" id="barra-progreso"></div>
            </div>
            <div class="reproductor-tiempo">
                <span id="tiempo-actual">0:00</span>
                <span id="tiempo-total">0:00</span>
            </div>
        </div>
        <div class="reproductor-controles">
            <button class="btn-control" id="btn-anterior" title="Anterior">⏮</button>
            <button class="btn-control btn-play" id="btn-play" title="Reproducir">▶</button>
            <button class="btn-control" id="btn-siguiente" title="Siguiente">⏭</button>
        </div>
        <audio id="audio-musica" preload="auto"></audio>
    </div>

    <!-- Contenido principal -->
    <main class="contenedor-principal">

        <!-- Contador compacto -->
        <section class="contador">
            <h2 class="contador-titulo">Juntos desde hace</h2>
            <div class="tiempo-fila-superior">
                <div class="bloque"><span id="anos">0</span><small>Años</small></div>
                <div class="bloque"><span id="meses">0</span><small>Meses</small></div>
                <div class="bloque"><span id="semanas">0</span><small>Sem</small></div>
                <div class="bloque"><span id="dias">0</span><small>Días</small></div>
            </div>
            <div class="tiempo-fila-inferior">
                <div class="bloque"><span id="horas">0</span><small>H</small></div>
                <div class="bloque"><span id="minutos">0</span><small>M</small></div>
                <div class="bloque"><span id="segundos">0</span><small>S</small></div>
            </div>
        </section>

        <!-- Frase del día (PROTAGONISTA) -->
        <section class="tarjeta-diaria">
            <h2 class="diaria-titulo">Pensamiento de hoy</h2>
            <p class="frase-del-dia" id="frase">Cargando...</p>
            <button class="btn-voz" id="btn-voz">
                🎙️ Escuchar mi voz
            </button>
        </section>

    </main>

    <!-- Audio oculto para tu voz -->
    <audio id="audio-voz"></audio>

    <script src="script.js"></script>
</body>
</html>
